name: Rigenera illustrazioni

# Rigenera solo alcune immagini di un capitolo in revisione e fa commit sullo stesso branch della PR.
on:
  workflow_dispatch:
    inputs:
      branch: { description: "Branch del capitolo (es. capitolo/cap6-gabriel-omar)", required: true }
      cap: { description: "Id del capitolo (es. cap6)", required: true }
      solo: { description: "Immagini da rifare: schede,p01,p03,p06,p07,p10,cornice,colorare", required: true }
      nota: { description: "Istruzione extra, es. p10=il papà tira fortissimo il pallone verso la TV", required: false }

permissions:
  contents: write

jobs:
  regen:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with: { ref: "${{ inputs.branch }}" }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r pipeline/requirements.txt
      - name: Illustrazioni con Gemini
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          CAP: ${{ inputs.cap }}
          SOLO: ${{ inputs.solo }}
          NOTA: ${{ inputs.nota }}
        run: |
          if [ -n "$NOTA" ]; then
            python edizione-2/tools/genera_capitolo_gemini.py "$CAP" --solo "$SOLO" --nota "$NOTA"
          else
            python edizione-2/tools/genera_capitolo_gemini.py "$CAP" --solo "$SOLO"
          fi
      - name: Commit sul branch del capitolo
        env:
          SOLO: ${{ inputs.solo }}
          BRANCH: ${{ inputs.branch }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add edizione-2/assets/
          git commit -m "Rigenerate illustrazioni: $SOLO"
          git push origin "HEAD:$BRANCH"
