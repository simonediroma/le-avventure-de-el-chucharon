name: Produci capitolo (testo + illustrazioni)

# Avvio: un maintainer aggiunge l'etichetta "produci" a una proposta approvata,
# oppure automatico da valida-proposta.yml (AUTO_PRODUCE=true), oppure manuale.
# Il capitolo viene prodotto nel formato della 2ª edizione (edizione-2/).
on:
  issues:
    types: [labeled]
  workflow_dispatch:
    inputs:
      issue: { description: "Numero issue della proposta", required: true }
  workflow_call:
    inputs:
      issue: { type: string, required: true }

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  produce:
    # inputs.issue è valorizzato quando arriva da workflow_dispatch o workflow_call
    # (in workflow_call github.event_name resta quello del chiamante, cioè "issues")
    if: inputs.issue != '' || (github.event.label.name == 'produci' && contains(github.event.issue.labels.*.name, 'approvata'))
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      N: ${{ inputs.issue || github.event.issue.number }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r pipeline/requirements.txt

      - name: Rivalida e scrivi il capitolo con Claude
        id: gen
        env: { ANTHROPIC_API_KEY: "${{ secrets.ANTHROPIC_API_KEY }}" }
        run: |
          set -o pipefail
          gh issue view "$N" --repo "$GITHUB_REPOSITORY" --json body -q .body > issue.md
          python pipeline/validate_proposal.py --body-file issue.md --out validation.json --comment comment.md
          cap=$(python pipeline/generate_chapter.py --validation validation.json --issue "$N" | tail -1)
          if [ -z "$cap" ]; then echo "::error::Capitolo non generato"; exit 1; fi
          slug=$(python -c "import json;print(json.load(open('proposals/$N.json'))['slug'])")
          echo "CAP=$cap" >> "$GITHUB_ENV"
          echo "SLUG=$slug" >> "$GITHUB_ENV"

      - name: Illustrazioni con Gemini (stile 2ª edizione)
        env: { GEMINI_API_KEY: "${{ secrets.GEMINI_API_KEY }}" }
        run: python edizione-2/tools/genera_capitolo_gemini.py "$CAP"

      - name: Anteprima PDF del capitolo
        run: python edizione-2/impagina.py --web --senza-copertina --solo "$CAP-" --output "anteprima-$SLUG.pdf"
      - uses: actions/upload-artifact@v4
        with: { name: "anteprima-${{ env.SLUG }}", path: "anteprima-*.pdf" }

      - name: Apri la pull request
        id: pr
        uses: peter-evans/create-pull-request@v7
        with:
          branch: capitolo/${{ env.SLUG }}
          title: "Nuovo capitolo: ${{ env.SLUG }} (proposta #${{ env.N }})"
          commit-message: "Nuovo capitolo ${{ env.SLUG }} dalla proposta #${{ env.N }}"
          add-paths: |
            edizione-2/testo.md
            edizione-2/pagine.json
            edizione-2/capitoli/
            edizione-2/assets/${{ env.CAP }}/
            edizione-2/assets/da-colorare/${{ env.CAP }}.png
            book/registry.json
            proposals/
          body: |
            Capitolo generato automaticamente dalla proposta #${{ env.N }}, nel formato della 2ª edizione.

            - Testo: Claude (`edizione-2/testo.md`) · Illustrazioni: Gemini (`edizione-2/tools/genera_capitolo_gemini.py`)
            - Anteprima PDF negli artifact di questo workflow.
            - Per rifare una o più immagini: workflow **Rigenera illustrazioni** (branch `capitolo/${{ env.SLUG }}`, capitolo `${{ env.CAP }}`).

            Rivedi testo e immagini, poi fai merge: il sito verrà ripubblicato in automatico.
            Closes #${{ env.N }}

      - name: Aggiorna la proposta
        run: |
          gh label create in-produzione --color 1D76DB --repo "$GITHUB_REPOSITORY" 2>/dev/null || true
          gh issue edit "$N" --repo "$GITHUB_REPOSITORY" --add-label in-produzione --remove-label produci || true
          gh issue comment "$N" --repo "$GITHUB_REPOSITORY" --body "🎨 Capitolo prodotto! Revisione in corso: ${{ steps.pr.outputs.pull-request-url }}"
